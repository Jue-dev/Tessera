name: Wave 3 temporary decoder formatter

on:
  push:
    branches: [ "wave3/phase1-decoder-sharing" ]
    paths:
      - "src/disasm/x86_instruction_decoder.cpp"

permissions:
  contents: write

jobs:
  format-decoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - name: Format shared decoder
        shell: bash
        run: |
          set -euo pipefail
          clang-format-18 -i src/disasm/x86_instruction_decoder.cpp
          if ! git diff --quiet -- src/disasm/x86_instruction_decoder.cpp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/disasm/x86_instruction_decoder.cpp
            git commit -m "style(disasm): format shared decoder"
            git push
          fi
