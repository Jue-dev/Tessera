name: Tessera Release
on:
 push:
  tags: ["v*.*.*"]
 workflow_dispatch:
  inputs:
   tag_name: {description: "Existing version tag to release", required: true, type: string}
concurrency:
 group: tessera-release-\${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
 cancel-in-progress: false
permissions: {contents: read}
jobs:
 release:
  runs-on: windows-latest
  permissions: {contents: write}
  steps:
   - uses: actions/checkout@v5
     with: {ref: \${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}, persist-credentials: false}
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - name: Export SDK, checksum and validate
     shell: pwsh
     env: {RELEASE_TAG: \${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}}
     run: .\.github\scripts\ci-sdk.ps1 -Task package-release -ReleaseTag "$env:RELEASE_TAG"
   - name: Verify installed SDK consumers
     shell: pwsh
     run: |
      $src=Join-Path $env:GITHUB_WORKSPACE "verify/tests/consumers/installed"
      foreach($a in @("x64","x86")){ $plat=if($a -eq "x64"){"x64"}else{"Win32"};foreach($cfg in @("Release","Debug")){
       $p=Join-Path $env:GITHUB_WORKSPACE "dist/TesseraSDK/$a/$cfg";$b=Join-Path $env:GITHUB_WORKSPACE "build-installed-consumer/$a/$cfg"
       cmake -S $src -B $b -G "Visual Studio 18 2026" -A $plat "-DCMAKE_PREFIX_PATH=$p";if($LASTEXITCODE -ne 0){throw "consumer configure failed"}
       cmake --build $b --config $cfg --parallel;if($LASTEXITCODE -ne 0){throw "consumer build failed"}
       $exe=Join-Path $b "$cfg/tessera_installed_consumer.exe";if(!(Test-Path $exe)){throw "consumer executable missing"};& $exe;if($LASTEXITCODE -ne 0){throw "consumer execution failed"}
      }}
   - uses: actions/upload-artifact@v7
     with:
      name: Tessera-SDK-\${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      path: |
       Tessera-SDK-\${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}.zip
       SHA256SUMS.txt
      if-no-files-found: error
   - uses: softprops/action-gh-release@v2
     with:
      tag_name: \${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      files: |
       Tessera-SDK-\${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}.zip
       SHA256SUMS.txt
      generate_release_notes: true
      overwrite_files: true
