name: Continuous Fuzzing

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Per-target fuzz duration
        required: true
        default: "60"
        type: choice
        options: [ "30", "60", "120", "300" ]
  schedule:
    - cron: "43 2 * * 2,5"

permissions:
  contents: read

concurrency:
  group: tessera-continuous-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-linux:
    name: Fuzz ${{ matrix.target }} (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tessera_fuzz_pe
            corpus: pe
          - target: tessera_fuzz_json
            corpus: json
          - target: tessera_fuzz_pattern
            corpus: pattern
          - target: tessera_fuzz_profile_json
            corpus: profile_json
          - target: tessera_fuzz_rtti_discovery
            corpus: rtti_discovery
          - target: tessera_fuzz_python_bridge
            corpus: python_bridge
          - target: tessera_fuzz_scanner
            corpus: scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure Clang libFuzzer with ASan and UBSan
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTESSERA_BUILD_TESTS=OFF -DTESSERA_BUILD_EXAMPLES=OFF \
            -DTESSERA_BUILD_FUZZ=ON -DTESSERA_ENABLE_LIBFUZZER=ON \
            -DTESSERA_STATIC_RUNTIME=ON

      - name: Build target
        run: cmake --build build-fuzz --target ${{ matrix.target }} --parallel 2

      - name: Run bounded corpus campaign
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          duration="${{ inputs.duration_seconds || '60' }}"
          corpus="verify/fuzz/corpus/${{ matrix.corpus }}"
          mkdir -p artifacts/fuzz
          timeout "$((duration + 30))" "build-fuzz/verify/fuzz/${{ matrix.target }}" \
            "$corpus" "-max_total_time=$duration" -timeout=10 -rss_limit_mb=4096 \
            -print_final_stats=1 2>&1 | tee "artifacts/fuzz/${{ matrix.target }}.summary.txt"

      - name: Upload bounded fuzz summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-summary
          path: artifacts/fuzz/*.summary.txt
          if-no-files-found: ignore

  fuzz-native-hook-windows:
    name: Fuzz native_hook (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC x64
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Configure MSVC fuzzer
        shell: pwsh
        run: |
          cmake -S . -B build-native-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DTESSERA_BUILD_TESTS=OFF -DTESSERA_BUILD_EXAMPLES=OFF `
            -DTESSERA_BUILD_FUZZ=ON -DTESSERA_ENABLE_MSVC_FUZZER=ON `
            -DTESSERA_ENABLE_ASAN=ON -DTESSERA_STATIC_RUNTIME=ON

      - name: Build native hook fuzzer
        run: cmake --build build-native-fuzz --target tessera_fuzz_native_hook --parallel

      - name: Run bounded native hook corpus
        shell: pwsh
        run: |
          $duration = [int]("${{ inputs.duration_seconds || '60' }}")
          $exe = ".\build-native-fuzz\verify\fuzz\tessera_fuzz_native_hook.exe"
          & $exe ".\verify\fuzz\corpus\native_hook" "-runs=10000" "-max_total_time=$duration" "-timeout=10" "-print_final_stats=1"
          if ($LASTEXITCODE -ne 0) { throw "Native hook fuzzing failed: $LASTEXITCODE" }
