name: Tessera PR Smoke

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths:
      - ".clang-tidy"
      - "*.cmake"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "verify/**"
      - "examples/**"
      - "scripts/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

# A newer commit on the same PR replaces an older smoke run instead of
# creating an unbounded queue of Windows runners.
concurrency:
  group: tessera-pr-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  x64-debug-smoke:
    name: x64 Debug build and tests
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC x64
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure
        run: cmake --preset x64-debug

      - name: Build
        run: cmake --build --preset x64-debug --parallel

      - name: Test
        run: ctest --preset x64-debug --output-on-failure
