name: Tessera PR Smoke

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths:
      - ".clang-tidy"
      - "*.cmake"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "verify/**"
      - "examples/**"
      - "scripts/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

# A newer commit on the same PR replaces an older smoke run instead of
# creating an unbounded queue of Windows runners.
concurrency:
  group: tessera-pr-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.arch }} ${{ matrix.configuration }} build and tests
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: x64-debug
            configuration: Debug
          - arch: x86
            preset: x86-debug
            configuration: Debug
          - arch: x64
            preset: x64-release
            configuration: Release
          - arch: x86
            preset: x86-release
            configuration: Release

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Enable native-hook fuzz smoke (x64 Release)
        if: matrix.preset == 'x64-release'
        run: cmake -S . -B artifacts/x64/Release/build -DTESSERA_BUILD_FUZZ=ON

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Run deterministic native-hook fuzz stress corpus
        if: matrix.preset == 'x64-release'
        shell: pwsh
        run: |
          $target = "artifacts/x64/Release/build/verify/fuzz/tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing native-hook fuzz target: $target" }
          & $target
          if ($LASTEXITCODE -ne 0) { throw "Native-hook fuzz smoke failed ($LASTEXITCODE)" }
