name: C++ Formatting

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".clang-format"
      - "src/**"
      - "include/**"
      - "examples/**"
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format (changed production C/C++ files)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Check changed production C/C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            'src/*.c' 'src/**/*.c' 'src/*.cc' 'src/**/*.cc' 'src/*.cpp' 'src/**/*.cpp' 'src/*.cxx' 'src/**/*.cxx' \
            'include/*.h' 'include/**/*.h' 'include/*.hh' 'include/**/*.hh' 'include/*.hpp' 'include/**/*.hpp' 'include/*.hxx' 'include/**/*.hxx' \
            'examples/*.c' 'examples/**/*.c' 'examples/*.cc' 'examples/**/*.cc' 'examples/*.cpp' 'examples/**/*.cpp' 'examples/*.cxx' 'examples/**/*.cxx' \
            'examples/*.h' 'examples/**/*.h' 'examples/*.hh' 'examples/**/*.hh' 'examples/*.hpp' 'examples/**/*.hpp' 'examples/*.hxx' 'examples/**/*.hxx')
          if (("${#files[@]}" == 0)); then
            echo "No changed production C/C++ files to format-check."
            exit 0
          fi
          printf 'Checking %s changed production C/C++ files with repository .clang-format\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          clang-format-18 --dry-run --Werror "${files[@]}"
