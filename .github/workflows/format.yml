name: C++ Formatting

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".clang-format"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.h"
      - "**/*.hh"
      - "**/*.hpp"
      - "**/*.hxx"
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format (changed C/C++ files)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned clang-format major version
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Check changed C/C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          if (("${#files[@]}" == 0)); then
            echo "No changed C/C++ files to format-check."
            exit 0
          fi
          printf 'Checking %s changed C/C++ files with repository .clang-format\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          clang-format-18 --dry-run --Werror "${files[@]}"
