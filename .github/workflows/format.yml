name: C++ Formatting

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".clang-format"
      - "src/**"
      - "include/**"
      - "examples/**"
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clang-format:
    name: clang-format 18 (format changed production C/C++ files)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Format changed production C/C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            'src/*.c' 'src/**/*.c' 'src/*.cc' 'src/**/*.cc' 'src/*.cpp' 'src/**/*.cpp' 'src/*.cxx' 'src/**/*.cxx' \
            'include/*.h' 'include/**/*.h' 'include/*.hh' 'include/**/*.hh' 'include/*.hpp' 'include/**/*.hpp' 'include/*.hxx' 'include/**/*.hxx' \
            'examples/*.c' 'examples/**/*.c' 'examples/*.cc' 'examples/**/*.cc' 'examples/*.cpp' 'examples/**/*.cpp' 'examples/*.cxx' 'examples/**/*.cxx' \
            'examples/*.h' 'examples/**/*.h' 'examples/*.hh' 'examples/**/*.hh' 'examples/*.hpp' 'examples/**/*.hpp' 'examples/*.hxx' 'examples/**/*.hxx')
          if (("${#files[@]}" == 0)); then
            echo "No changed production C/C++ files to format."
            exit 0
          fi

          printf 'Formatting %s changed production C/C++ files with repository .clang-format\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          clang-format-18 -i "${files[@]}"

          if git diff --quiet; then
            echo "All changed production C/C++ files were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply clang-format 18 to changed C++ sources"
          git push origin "HEAD:$HEAD_REF"
