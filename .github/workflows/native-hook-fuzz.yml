name: Native Hook Fuzz & Stress Validation

on:
  pull_request:
    paths:
      - ".github/workflows/native-hook-fuzz.yml"
      - ".github/actions/setup-msvc/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "src/hook/**"
      - "src/platform/windows/**"
      - "include/tessera/hook/**"
      - "verify/fuzz/**"
  workflow_dispatch:
    inputs:
      campaign_seconds:
        description: "x86 and x64 coverage-guided fuzz campaign duration."
        required: true
        type: choice
        default: "300"
        options:
          - "300"
          - "600"
          - "900"
  schedule:
    - cron: "41 4 * * 1" # Weekly Monday 04:41 UTC, 300-second campaigns.

permissions:
  contents: read

concurrency:
  # New commits supersede old PR runs; manual and scheduled runs remain isolated.
  group: tessera-native-hook-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-hook-fuzz-x64:
    name: Windows x64 Coverage-Guided Native Hook Fuzz
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install LLVM 22 for C++23 and libFuzzer
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          directory: ${{ runner.temp }}/llvm22

      - name: Setup MSVC Developer Environment (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Verify Clang x64 toolchain and sanitizer runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $clang = Get-Command clang-cl -ErrorAction Stop
          Write-Host "Using clang-cl: $($clang.Source)"
          clang-cl --version
          if ($LASTEXITCODE -ne 0) { throw "clang-cl version check failed ($LASTEXITCODE)" }
          clang-cl "--target=x86_64-pc-windows-msvc" -v
          if ($LASTEXITCODE -ne 0) { throw "clang-cl x64 target check failed ($LASTEXITCODE)" }

          $resource = (clang-cl -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $resource) { throw "Unable to locate Clang resource directory." }
          $runtimeDir = Join-Path $resource "lib/windows"
          $required = @(
            "clang_rt.fuzzer-x86_64.lib",
            "clang_rt.asan_dynamic-x86_64.lib",
            "clang_rt.asan_static_runtime_thunk-x86_64.lib",
            "clang_rt.asan_dynamic-x86_64.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $runtimeDir $name
            if (-not (Test-Path $path)) { throw "Missing required x64 Clang runtime: $path" }
            Write-Host "Found: $name"
          }

      - name: Configure instrumented native-hook fuzzer (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeArgs = @(
            "-S", ".", "-B", "build-native-hook-fuzz", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_CXX_STANDARD=23",
            "-DTESSERA_BUILD_TESTS=OFF",
            "-DTESSERA_BUILD_EXAMPLES=OFF",
            "-DTESSERA_BUILD_FUZZ=ON",
            "-DTESSERA_STATIC_RUNTIME=ON",
            "-DTESSERA_ENABLE_LIBFUZZER=ON"
          )
          & cmake @cmakeArgs
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
            $diagnosticLogs = @(
              "build-native-hook-fuzz/CMakeFiles/CMakeConfigureLog.yaml",
              "build-native-hook-fuzz/CMakeFiles/CMakeError.log",
              "build-native-hook-fuzz/CMakeFiles/CMakeOutput.log"
            )
            foreach ($logPath in $diagnosticLogs) {
              if (Test-Path $logPath) {
                Write-Host "===== $logPath ====="
                Get-Content $logPath -Tail 240
              }
            }
            throw "CMake configure failed for x64 ($configureExitCode)"
          }

      - name: Build instrumented native-hook fuzzer (x64)
        shell: pwsh
        run: |
          cmake --build build-native-hook-fuzz --target tessera_fuzz_native_hook --parallel
          if ($LASTEXITCODE -ne 0) { throw "x64 native-hook fuzzer build failed ($LASTEXITCODE)" }

      - name: Verify x64 fuzzer executable architecture
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz/verify/fuzz/tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing x64 fuzzer executable: $target" }
          $bytes = [System.IO.File]::ReadAllBytes($target)
          if ($bytes.Length -lt 64) { throw "Fuzzer executable is too small to be a valid PE image." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 64 -or ($peOffset + 6) -gt $bytes.Length) { throw "Invalid PE header offset: $peOffset" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}" -f $machine) }
          Write-Host "Verified executable architecture: AMD64 (PE 0x8664)."

      - name: Run x64 coverage-guided ASan/UBSan campaign
        shell: pwsh
        env:
          CAMPAIGN_SECONDS: ${{ inputs.campaign_seconds || '300' }}
        run: |
          $ErrorActionPreference = "Stop"
          $seedSource = Join-Path $env:GITHUB_WORKSPACE "verify/fuzz/corpus/native_hook"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/native-hook-fuzz/x64"
          $corpus = Join-Path $artifactRoot "corpus"
          $crashes = Join-Path $artifactRoot "crashes"
          New-Item -ItemType Directory -Path $corpus -Force | Out-Null
          New-Item -ItemType Directory -Path $crashes -Force | Out-Null
          $seedFiles = @(Get-ChildItem -Path $seedSource -File)
          if ($seedFiles.Count -eq 0) { throw "The x64 native-hook seed corpus is empty." }
          Copy-Item -Path (Join-Path $seedSource "*") -Destination $corpus -Recurse -Force

          if ($env:CAMPAIGN_SECONDS -notin @("300", "600", "900")) {
            throw "Unsupported fuzz duration: $env:CAMPAIGN_SECONDS"
          }
          $target = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz/verify/fuzz/tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing x64 native-hook fuzzer: $target" }

          $resource = (clang-cl -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $resource) { throw "Unable to locate Clang resource directory." }
          $asanDll = Join-Path $resource "lib/windows/clang_rt.asan_dynamic-x86_64.dll"
          if (-not (Test-Path $asanDll)) { throw "Missing x64 ASan runtime DLL: $asanDll" }
          Copy-Item $asanDll (Split-Path $target -Parent) -Force

          $stdoutPath = Join-Path $artifactRoot "campaign.stdout.log"
          $stderrPath = Join-Path $artifactRoot "campaign.stderr.log"
          $campaignLogPath = Join-Path $artifactRoot "campaign.log"
          $arguments = @(
            $corpus,
            "-max_total_time=$env:CAMPAIGN_SECONDS",
            "-timeout=10",
            "-max_len=96",
            "-rss_limit_mb=4096",
            "-seed=20261119",
            "-print_final_stats=1",
            "-artifact_prefix=$crashes/"
          )

          # libFuzzer's normal INFO/progress output goes to stderr. Capture both
          # streams as artifacts to avoid GitHub Actions marking routine INFO red.
          $process = Start-Process -FilePath $target -ArgumentList $arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if ($process.ExitCode -ne 0) { throw "x64 coverage-guided fuzzing failed ($($process.ExitCode))" }

          $stdout = if (Test-Path $stdoutPath) { [System.IO.File]::ReadAllText($stdoutPath) } else { "" }
          $stderr = if (Test-Path $stderrPath) { [System.IO.File]::ReadAllText($stderrPath) } else { "" }
          [System.IO.File]::WriteAllText($campaignLogPath, $stdout + [Environment]::NewLine + $stderr)
          $campaignLog = Get-Content $campaignLogPath -Raw
          if ($campaignLog -notmatch "stat::number_of_executed_units:\s*[1-9][0-9]*") {
            throw "libFuzzer did not report any executed input units; refusing a false-positive pass."
          }
          $summary = [regex]::Match($campaignLog, "(?m)^Done\s+([0-9,]+)\s+runs\s+in\s+([0-9]+)\s+second")
          if (-not $summary.Success) { throw "x64 libFuzzer campaign summary is missing." }
          $runs = [UInt64](($summary.Groups[1].Value -replace ",", ""))
          $seconds = [UInt32]$summary.Groups[2].Value
          $minimumSeconds = [Math]::Max(1, [Int32]$env:CAMPAIGN_SECONDS - 5)
          if ($runs -lt 100000 -or $seconds -lt $minimumSeconds) {
            throw "x64 campaign under-ran: runs=$runs, seconds=$seconds."
          }
          Write-Host "x64 campaign completed $runs runs in $seconds seconds."

      - name: Upload x64 fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hook-libfuzzer-x64-${{ github.run_number }}
          path: artifacts/native-hook-fuzz/x64/
          if-no-files-found: warn

  native-hook-fuzz-x86:
    name: Windows x86 MSVC Coverage-Guided Native Hook Fuzz
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Environment (x86)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x86

      - name: Verify native MSVC x86 Fuzzer and AddressSanitizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VSCMD_ARG_TGT_ARCH -ne "x86") {
            throw "Expected x86 MSVC target environment, got '$env:VSCMD_ARG_TGT_ARCH'."
          }

          $probeSource = Join-Path $env:RUNNER_TEMP "tessera_msvc_x86_fuzzer_probe.cpp"
          $probeExe = Join-Path $env:RUNNER_TEMP "tessera_msvc_x86_fuzzer_probe.exe"
          @'
          #include <cstddef>
          #include <cstdint>
          extern "C" int LLVMFuzzerTestOneInput(const std::uint8_t* data, std::size_t size) {
              volatile std::uint8_t value = size == 0 ? 0 : data[0];
              (void)value;
              return 0;
          }
          '@ | Set-Content -Path $probeSource -Encoding ascii

          cl /nologo /std:c++latest /Zc:__cplusplus /EHsc /MT /fsanitize=address /fsanitize=fuzzer $probeSource "/Fe:$probeExe"
          if ($LASTEXITCODE -ne 0) { throw "MSVC x86 Fuzzer/ASan probe compile failed ($LASTEXITCODE)" }
          if (-not (Test-Path $probeExe)) { throw "MSVC x86 Fuzzer probe executable was not produced." }

          $probeOutput = & $probeExe "-runs=8" 2>&1
          $probeExitCode = $LASTEXITCODE
          $probeOutput | ForEach-Object { Write-Host $_ }
          if ($probeExitCode -ne 0) { throw "MSVC x86 Fuzzer/ASan probe execution failed ($probeExitCode)" }
          $probeText = [string]::Join([Environment]::NewLine, @($probeOutput))
          if ($probeText -notmatch "Done\s+8\s+runs") {
            throw "MSVC x86 Fuzzer probe did not complete the requested eight executions."
          }

          $asanName = "clang_rt.asan_dynamic-i386.dll"
          $searchRoots = @($env:VCToolsInstallDir, $env:VCToolsRedistDir) | Where-Object { $_ -and (Test-Path $_) }
          $asanDll = $null
          foreach ($root in $searchRoots) {
            $match = Get-ChildItem -Path $root -Filter $asanName -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($match) { $asanDll = $match.FullName; break }
          }
          if (-not $asanDll) { throw "MSVC x86 AddressSanitizer runtime DLL '$asanName' was not found." }
          Write-Host "Verified MSVC x86 Fuzzer and ASan runtime: $asanDll"

      - name: Configure instrumented native-hook fuzzer (x86)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeArgs = @(
            "-S", ".", "-B", "build-native-hook-fuzz", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
            "-DCMAKE_C_COMPILER=cl",
            "-DCMAKE_CXX_COMPILER=cl",
            "-DCMAKE_CXX_STANDARD=23",
            "-DTESSERA_BUILD_TESTS=OFF",
            "-DTESSERA_BUILD_EXAMPLES=OFF",
            "-DTESSERA_BUILD_FUZZ=ON",
            "-DTESSERA_STATIC_RUNTIME=ON",
            "-DTESSERA_ENABLE_ASAN=ON",
            "-DTESSERA_ENABLE_MSVC_FUZZER=ON"
          )
          & cmake @cmakeArgs
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
            $diagnosticLogs = @(
              "build-native-hook-fuzz/CMakeFiles/CMakeConfigureLog.yaml",
              "build-native-hook-fuzz/CMakeFiles/CMakeError.log",
              "build-native-hook-fuzz/CMakeFiles/CMakeOutput.log"
            )
            foreach ($logPath in $diagnosticLogs) {
              if (Test-Path $logPath) {
                Write-Host "===== $logPath ====="
                Get-Content $logPath -Tail 240
              }
            }
            throw "CMake configure failed for x86 ($configureExitCode)"
          }

      - name: Build instrumented native-hook fuzzer (x86)
        shell: pwsh
        run: |
          cmake --build build-native-hook-fuzz --target tessera_fuzz_native_hook --parallel
          if ($LASTEXITCODE -ne 0) { throw "MSVC x86 native-hook fuzzer build failed ($LASTEXITCODE)" }

      - name: Verify x86 fuzzer executable architecture
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz/verify/fuzz/tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing x86 fuzzer executable: $target" }
          $bytes = [System.IO.File]::ReadAllBytes($target)
          if ($bytes.Length -lt 64) { throw "Fuzzer executable is too small to be a valid PE image." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 64 -or ($peOffset + 6) -gt $bytes.Length) { throw "Invalid PE header offset: $peOffset" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw ("Expected I386 PE machine 0x014c, got 0x{0:X4}" -f $machine) }
          Write-Host "Verified executable architecture: I386 (PE 0x014c)."

      - name: Locate and stage x86 AddressSanitizer runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asanName = "clang_rt.asan_dynamic-i386.dll"
          $searchRoots = @($env:VCToolsInstallDir, $env:VCToolsRedistDir) | Where-Object { $_ -and (Test-Path $_) }
          $asanDll = $null
          foreach ($root in $searchRoots) {
            $match = Get-ChildItem -Path $root -Filter $asanName -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($match) { $asanDll = $match.FullName; break }
          }
          if (-not $asanDll) { throw "MSVC x86 AddressSanitizer runtime DLL '$asanName' was not found." }
          $targetDir = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz/verify/fuzz"
          Copy-Item $asanDll (Join-Path $targetDir $asanName) -Force
          Write-Host "Staged x86 ASan runtime: $asanDll"

      - name: Run x86 coverage-guided ASan campaign
        shell: pwsh
        env:
          CAMPAIGN_SECONDS: ${{ inputs.campaign_seconds || '300' }}
        run: |
          $ErrorActionPreference = "Stop"
          $seedSource = Join-Path $env:GITHUB_WORKSPACE "verify/fuzz/corpus/native_hook"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/native-hook-fuzz/x86"
          $corpus = Join-Path $artifactRoot "corpus"
          $crashes = Join-Path $artifactRoot "crashes"
          New-Item -ItemType Directory -Path $corpus -Force | Out-Null
          New-Item -ItemType Directory -Path $crashes -Force | Out-Null
          $seedFiles = @(Get-ChildItem -Path $seedSource -File)
          if ($seedFiles.Count -eq 0) { throw "The x86 native-hook seed corpus is empty." }
          Copy-Item -Path (Join-Path $seedSource "*") -Destination $corpus -Recurse -Force

          if ($env:CAMPAIGN_SECONDS -notin @("300", "600", "900")) {
            throw "Unsupported fuzz duration: $env:CAMPAIGN_SECONDS"
          }
          $target = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz/verify/fuzz/tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing x86 native-hook fuzzer: $target" }

          $stdoutPath = Join-Path $artifactRoot "campaign.stdout.log"
          $stderrPath = Join-Path $artifactRoot "campaign.stderr.log"
          $campaignLog = Join-Path $artifactRoot "campaign.log"
          $arguments = @(
            $corpus,
            "-max_total_time=$env:CAMPAIGN_SECONDS",
            "-timeout=10",
            "-max_len=96",
            "-rss_limit_mb=1024",
            "-seed=20261119",
            "-print_final_stats=1",
            "-artifact_prefix=$crashes/"
          )

          $process = Start-Process -FilePath $target -ArgumentList $arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if ($process.ExitCode -ne 0) { throw "x86 coverage-guided Fuzzer/ASan campaign failed ($($process.ExitCode))" }

          $stdout = if (Test-Path $stdoutPath) { [System.IO.File]::ReadAllText($stdoutPath) } else { "" }
          $stderr = if (Test-Path $stderrPath) { [System.IO.File]::ReadAllText($stderrPath) } else { "" }
          [System.IO.File]::WriteAllText($campaignLog, $stdout + [Environment]::NewLine + $stderr)
          $campaignText = Get-Content $campaignLog -Raw

          $summary = [regex]::Match($campaignText, "(?m)^Done\s+([0-9,]+)\s+runs\s+in\s+([0-9]+)\s+second")
          if (-not $summary.Success) {
            throw "x86 MSVC Fuzzer did not report its completed run count and elapsed time."
          }
          $executedRuns = [UInt64](($summary.Groups[1].Value -replace ",", ""))
          $elapsedSeconds = [UInt32]$summary.Groups[2].Value
          $minimumDuration = [Math]::Max(1, [Int32]$env:CAMPAIGN_SECONDS - 5)
          if ($executedRuns -lt 100000 -or $elapsedSeconds -lt $minimumDuration) {
            throw "x86 fuzz campaign was too short or processed too few inputs: runs=$executedRuns, seconds=$elapsedSeconds."
          }
          if ($campaignText -notmatch "stat::number_of_executed_units:\s*[1-9][0-9]*") {
            throw "x86 MSVC Fuzzer did not report executed input units."
          }
          if ($campaignText -notmatch "cov:\s*[1-9][0-9]*") {
            throw "x86 MSVC Fuzzer did not report non-zero coverage."
          }

          Write-Host "x86 MSVC Fuzzer summary: $executedRuns executions in $elapsedSeconds seconds."
          Get-Content $campaignLog -Tail 40 | ForEach-Object { Write-Host $_ }
          Write-Host "Full x86 campaign log: $campaignLog"

      - name: Upload x86 fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hook-libfuzzer-x86-${{ github.run_number }}
          path: artifacts/native-hook-fuzz/x86/
          if-no-files-found: warn
