name: Native Hook Fuzz & Stress Validation

on:
  pull_request:
    paths:
      - ".github/workflows/native-hook-fuzz.yml"
      - ".github/scripts/native-hook-fuzz/**"
      - ".github/actions/setup-msvc/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "src/hook/**"
      - "src/platform/windows/**"
      - "include/tessera/hook/**"
      - "verify/fuzz/**"
      - "verify/tests/patch_hook/**"
  workflow_dispatch:
    inputs:
      campaign_seconds:
        description: "x86 and x64 coverage-guided fuzz campaign duration."
        required: true
        type: choice
        default: "300"
        options:
          - "300"
          - "600"
          - "900"
  schedule:
    - cron: "41 4 * * 1" # Weekly Monday 04:41 UTC, 300-second campaigns.

permissions:
  contents: read

concurrency:
  # New commits supersede old PR runs; manual and scheduled runs remain isolated.
  group: tessera-native-hook-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-hook-fuzz-x64:
    name: Windows x64 Coverage-Guided Native Hook Fuzz
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install LLVM 22 for C++23 and libFuzzer
        # Node 24 migration pending upstream: KyleMayes/install-llvm-action#100.
        uses: yezhizhen/install-llvm-action@8000af8f91093e2002004ceab3abd0f56e4cbde0
        with:
          version: "22.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          directory: ${{ runner.temp }}/llvm22

      - name: Setup MSVC Developer Environment (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Verify x64 Clang and sanitizer environment
        shell: pwsh
        run: ./.github/scripts/native-hook-fuzz/setup-fuzzer-env.ps1 -Arch x64

      - name: Configure, build, and verify x64 fuzzer
        shell: pwsh
        run: ./.github/scripts/native-hook-fuzz/build-fuzzer.ps1 -Arch x64

      - name: Run x64 coverage-guided ASan/UBSan campaign
        shell: pwsh
        env:
          CAMPAIGN_SECONDS: ${{ inputs.campaign_seconds || '300' }}
        run: ./.github/scripts/native-hook-fuzz/run-fuzzer-campaign.ps1 -Arch x64

      - name: Upload x64 fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hook-libfuzzer-x64-${{ github.run_number }}
          path: artifacts/native-hook-fuzz/x64/
          if-no-files-found: warn

  native-hook-fuzz-x86:
    name: Windows x86 MSVC Coverage-Guided Native Hook Fuzz
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Environment (x86)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x86

      - name: Verify MSVC x86 Fuzzer and AddressSanitizer environment
        shell: pwsh
        run: ./.github/scripts/native-hook-fuzz/setup-fuzzer-env.ps1 -Arch x86

      - name: Configure, build, and verify x86 fuzzer
        shell: pwsh
        run: ./.github/scripts/native-hook-fuzz/build-fuzzer.ps1 -Arch x86

      - name: Run x86 coverage-guided MSVC ASan campaign
        shell: pwsh
        env:
          CAMPAIGN_SECONDS: ${{ inputs.campaign_seconds || '300' }}
        run: ./.github/scripts/native-hook-fuzz/run-fuzzer-campaign.ps1 -Arch x86

      - name: Upload x86 fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hook-libfuzzer-x86-${{ github.run_number }}
          path: artifacts/native-hook-fuzz/x86/
          if-no-files-found: warn
