name: Native Hook Coverage-Guided Fuzz

on:
  push:
    branches:
      - issue-6/unwind-lifecycle
    - main
    paths:
      - ".github/workflows/native-hook-fuzz.yml"
      - ".github/actions/setup-msvc/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "src/hook/**"
      - "src/platform/windows/**"
      - "include/tessera/hook/**"
      - "verify/fuzz/**"
  pull_request:
    paths:
      - ".github/workflows/native-hook-fuzz.yml"
      - ".github/actions/setup-msvc/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "src/hook/**"
      - "src/platform/windows/**"
      - "include/tessera/hook/**"
      - "verify/fuzz/**"
  workflow_dispatch:
    inputs:
      campaign_seconds:
        description: "Fuzz campaign duration per architecture."
        required: true
        type: choice
        default: "900"
        options:
          - "300"
          - "600"
          - "900"
  schedule:
    - cron: "41 4 * * 1" # Weekly Monday 04:41 UTC, 900-second campaigns.

permissions:
  contents: read

concurrency:
  group: tessera-native-hook-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-hook-fuzz:
    name: Windows ${{ matrix.arch }} Clang libFuzzer + ASan/UBSan
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - x86
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Environment (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Verify Clang toolchain and target
        shell: pwsh
        env:
          FUZZ_ARCH: ${{ matrix.arch }}
        run: |
          $clang = Get-Command clang-cl -ErrorAction Stop
          Write-Host "Using clang-cl: $($clang.Source)"
          clang-cl --version
          $target = if ($env:FUZZ_ARCH -eq "x86") { "i686-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
          clang-cl "--target=$target" -v

      - name: Inspect Clang sanitizer runtime libraries
        shell: pwsh
        env:
          FUZZ_ARCH: ${{ matrix.arch }}
        run: |
          $resource = (clang-cl -print-resource-dir).Trim()
          $runtimeDir = Join-Path $resource "lib\windows"
          $runtimeArch = if ($env:FUZZ_ARCH -eq "x86") { "i386" } else { "x86_64" }
          Write-Host "Clang resource directory: $resource"
          Write-Host "Runtime library directory: $runtimeDir"
          if (-not (Test-Path $runtimeDir)) { throw "Missing Clang Windows runtime directory: $runtimeDir" }
          $required = @(
            "clang_rt.fuzzer-$runtimeArch.lib",
            "clang_rt.asan_dynamic-$runtimeArch.lib",
            "clang_rt.asan_static_runtime_thunk-$runtimeArch.lib",
            "clang_rt.asan_dynamic-$runtimeArch.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $runtimeDir $name
            if (-not (Test-Path $path)) { throw "Missing required Clang runtime for $env:FUZZ_ARCH ($runtimeArch): $path" }
            Write-Host "Found: $name"
          }

      - name: Configure instrumented native-hook fuzzer
        shell: pwsh
        env:
          FUZZ_ARCH: ${{ matrix.arch }}
        run: |
          $cmakeArgs = @(
            "-S", ".", "-B", "build-native-hook-fuzz", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_CXX_STANDARD=23",
            "-DTESSERA_BUILD_TESTS=OFF",
            "-DTESSERA_BUILD_EXAMPLES=OFF",
            "-DTESSERA_BUILD_FUZZ=ON",
            "-DTESSERA_STATIC_RUNTIME=ON",
            "-DTESSERA_ENABLE_LIBFUZZER=ON"
          )
          if ($env:FUZZ_ARCH -eq "x86") {
            $cmakeArgs += @(
              "-DCMAKE_C_COMPILER_TARGET=i686-pc-windows-msvc",
              "-DCMAKE_CXX_COMPILER_TARGET=i686-pc-windows-msvc"
            )
          }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed for $env:FUZZ_ARCH ($LASTEXITCODE)" }

      - name: Build instrumented native-hook fuzzer
        run: cmake --build build-native-hook-fuzz --target tessera_fuzz_native_hook --parallel

      - name: Run coverage-guided campaign
        shell: pwsh
        env:
          FUZZ_ARCH: ${{ matrix.arch }}
          CAMPAIGN_SECONDS: ${{ inputs.campaign_seconds || '900' }}
        run: |
          $seedSource = Join-Path $env:GITHUB_WORKSPACE "verify\fuzz\corpus\native_hook"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\native-hook-fuzz\$env:FUZZ_ARCH"
          $corpus = Join-Path $artifactRoot "corpus"
          $crashes = Join-Path $artifactRoot "crashes"
          New-Item -ItemType Directory -Path $corpus -Force | Out-Null
          New-Item -ItemType Directory -Path $crashes -Force | Out-Null
          Copy-Item -Path (Join-Path $seedSource "*") -Destination $corpus -Recurse -Force
          $target = Join-Path $env:GITHUB_WORKSPACE "build-native-hook-fuzz\verify\fuzz\tessera_fuzz_native_hook.exe"
          if (-not (Test-Path $target)) { throw "Missing native-hook fuzzer for $($env:FUZZ_ARCH): $target" }
          $resource = (clang-cl -print-resource-dir).Trim()
          $runtimeArch = if ($env:FUZZ_ARCH -eq "x86") { "i386" } else { "x86_64" }
          $asanDll = Join-Path $resource "lib\windows\clang_rt.asan_dynamic-$runtimeArch.dll"
          if (-not (Test-Path $asanDll)) { throw "Missing ASan runtime DLL for $($env:FUZZ_ARCH): $asanDll" }
          Copy-Item $asanDll (Split-Path $target -Parent) -Force
          & $target $corpus "-max_total_time=$env:CAMPAIGN_SECONDS" "-timeout=10" "-max_len=96" "-rss_limit_mb=4096" "-seed=20261119" "-print_final_stats=1" "-artifact_prefix=$crashes\"
          if ($LASTEXITCODE -ne 0) { throw "Coverage-guided native-hook fuzzing failed for $env:FUZZ_ARCH ($LASTEXITCODE)" }

      - name: Upload architecture-specific fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hook-libfuzzer-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/native-hook-fuzz/${{ matrix.arch }}/
          if-no-files-found: warn
