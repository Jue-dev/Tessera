name: Clang-Tidy

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM Clang-Tidy and Ninja
        shell: pwsh
        run: |
          choco install llvm --version=23.1.3 --yes --no-progress
          choco install ninja --yes --no-progress
          "${env:ProgramFiles}\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Windows compile commands with clang-cl
        shell: pwsh
        run: |
          cmake -S . -B build-tidy -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DTESSERA_BUILD_TESTS=OFF -DTESSERA_BUILD_EXAMPLES=OFF

      - name: Run clang-tidy over library sources
        shell: pwsh
        run: |
          $sources = Get-ChildItem src -Recurse -Filter *.cpp | ForEach-Object { $_.FullName }
          foreach ($source in $sources) {
            Write-Host "clang-tidy: $source"
            & clang-tidy -p build-tidy -quiet -header-filter='.*include/tessera/.*' -extra-arg=-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH $source
            if ($LASTEXITCODE -ne 0) {
              throw "clang-tidy failed for $source ($LASTEXITCODE)"
            }
          }
