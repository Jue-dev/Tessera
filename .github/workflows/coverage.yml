name: Clang line and branch coverage

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 2"

permissions:
  contents: read

jobs:
  coverage:
    name: Windows clang-cl LLVM coverage
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM and Ninja
        shell: pwsh
        run: |
          choco install llvm --version=23.1.3 --yes --no-progress
          choco install ninja --yes --no-progress
          "${env:ProgramFiles}\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure coverage build with clang-cl
        shell: pwsh
        run: |
          cmake -S . -B build-coverage -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Debug -DTESSERA_BUILD_TESTS=ON -DTESSERA_BUILD_EXAMPLES=OFF -DTESSERA_ENABLE_COVERAGE=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-coverage --parallel 2

      - name: Run all CTest suites
        shell: pwsh
        env:
          LLVM_PROFILE_FILE: coverage-%p.profraw
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Export line and branch coverage
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/coverage
          shopt -s nullglob
          profiles=(coverage-*.profraw)
          if (("${#profiles[@]}" == 0)); then
            echo "No LLVM profile data produced." > artifacts/coverage/summary.txt
            exit 0
          fi
          llvm-profdata merge -sparse "${profiles[@]}" -o artifacts/coverage/merged.profdata
          mapfile -t binaries < <(find build-coverage/verify/tests -maxdepth 1 -type f -iname 'tessera_test_*.exe' | sort)
          for binary in "${binaries[@]}"; do
            name="$(basename "$binary" .exe)"
            llvm-cov export -format=lcov "$binary" -instr-profile=artifacts/coverage/merged.profdata > "artifacts/coverage/$name.info"
          done
          if (("${#binaries[@]}" > 0)); then
            report_args=("${binaries[0]}" -instr-profile=artifacts/coverage/merged.profdata -show-branch-summary)
            for binary in "${binaries[@]:1}"; do
              report_args+=(-object "$binary")
            done
            llvm-cov report "${report_args[@]}" > artifacts/coverage/summary.txt
            cat artifacts/coverage/summary.txt
            cat artifacts/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test executables found for llvm-cov." > artifacts/coverage/summary.txt
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tessera-coverage-report
          path: artifacts/coverage/
          if-no-files-found: ignore
