name: One-time source formatting

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"

permissions:
  contents: write

jobs:
  apply-clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Format changed production C and C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- \
            'src/*.c' 'src/**/*.c' 'src/*.cc' 'src/**/*.cc' 'src/*.cpp' 'src/**/*.cpp' 'src/*.cxx' 'src/**/*.cxx' \
            'include/*.h' 'include/**/*.h' 'include/*.hh' 'include/**/*.hh' 'include/*.hpp' 'include/**/*.hpp' 'include/*.hxx' 'include/**/*.hxx')
          if (("${#files[@]}" == 0)); then
            echo "No C/C++ source files to format."
            exit 0
          fi
          clang-format-18 -i "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "All changed C/C++ files already match clang-format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Apply clang-format to scanner implementation split"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
