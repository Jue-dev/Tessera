name: Project Validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: JSON validation profile path in this repository
        required: true
        default: verify/portable/profiles/tessera.portable-validation.json
        type: string
      repository:
        description: Target repository owner/name (blank uses profile)
        required: false
        type: string
      ref:
        description: Target branch, tag, or commit (blank uses profile)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout profile source
        uses: actions/checkout@v4
      - name: Read profile and resolve target
        id: config
        env:
          PROFILE: ${{ inputs.profile }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["PROFILE"]).resolve()
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if root not in p.parents: raise SystemExit("Profile path must stay within the repository")
          if not p.is_file(): raise SystemExit(f"Profile not found: {p}")
          cfg=json.loads(p.read_text())
          if cfg.get("schema_version") != 1: raise SystemExit("Unsupported profile schema")
          repo=os.environ.get("TARGET_REPOSITORY","").strip() or cfg.get("repo","")
          ref=os.environ.get("TARGET_REF","").strip() or cfg.get("ref","")
          if repo.startswith("https://github.com/"): repo=repo.removeprefix("https://github.com/").removesuffix(".git")
          if not repo or "/" not in repo or repo.startswith("-"): raise SystemExit("Repository must be owner/name or a GitHub HTTPS URL")
          if any(part in repo for part in ("..","\\"," ","\n","\r")): raise SystemExit("Invalid repository name")
          if "\n" in ref or "\r" in ref: raise SystemExit("Invalid ref")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write(f"repository={repo}\n")
            f.write(f"ref={ref}\n")
          PY
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: ${{ steps.config.outputs.ref }}
          path: target
          token: ${{ secrets.VALIDATION_GH_TOKEN || github.token }}
          persist-credentials: false
      - name: Install profile toolchain prerequisites
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg=json.load(open(os.environ["PROFILE"]))
          packages=set()
          mapping={"clang++":"clang","cmake":"cmake","ninja":"ninja-build","python3":"python3","git":"git"}
          for test in cfg.get("tests",[]):
            for tool in str(test.get("needs","")).split(","):
              if tool.strip() in mapping: packages.add(mapping[tool.strip()])
            command=str(test.get("command",""))
            if "-stdlib=libc++" in command: packages.update(["libc++-dev","libc++abi-dev"])
          if packages:
            with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("packages="+ " ".join(sorted(packages))+"\n")
          PY
          if [ -n "$(python3 -c 'import json,os; c=json.load(open(os.environ["PROFILE"])); print(" ".join(sorted({"clang":"clang","libc++-dev":"libc++-dev","libc++abi-dev":"libc++abi-dev","cmake":"cmake","ninja-build":"ninja-build","python3":"python3","git":"git"})))')" ]; then
            sudo apt-get update
            sudo apt-get install -y clang libc++-dev libc++abi-dev
          fi
      - name: Run profile setup and tests
        env:
          PROFILE: ${{ inputs.profile }}
          PROFILE_SOURCE: ${{ github.workspace }}
          TARGET: ${{ github.workspace }}/target
        run: python3 .github/scripts/project_validation_runner.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-validation-report
          path: PROJECT_VALIDATION_REPORT.txt
          if-no-files-found: warn
      - name: Publish report summary
        if: always()
        run: |
          if [ -f PROJECT_VALIDATION_REPORT.txt ]; then
            cat PROJECT_VALIDATION_REPORT.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
