name: Sanitizers and Concurrency

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 3"

permissions:
  contents: read

jobs:
  sanitizer:
    name: Clang ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan-UBSan
            flags: -fsanitize=address,undefined
            env_asan: detect_leaks=1:halt_on_error=1
            env_ubsan: halt_on_error=1:print_stacktrace=1
            env_tsan: ''
          - name: TSan
            flags: -fsanitize=thread
            env_asan: ''
            env_ubsan: ''
            env_tsan: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang g++-13 libstdc++-13-dev
          clang++ --version
                    printf '#include <expected>\n#include <bit>\nint main(){std::expected<int,int> x=1; return std::byteswap(1u)==1u && x.value()==1 ? 0 : 1;}\n' | clang++ -stdlib=libstdc++ -isystem /usr/include/c++/13 -isystem /usr/include/x86_64-linux-gnu/c++/13 -isystem /usr/include/c++/13/backward -std=c++23 -x c++ -fsyntax-only -

      - name: Build and run portable Windows-backend mock tests under sanitizer
        env:
          SANITIZER_FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: ${{ matrix.env_asan }}
          UBSAN_OPTIONS: ${{ matrix.env_ubsan }}
          TSAN_OPTIONS: ${{ matrix.env_tsan }}
        run: |
          CXX=clang++ EXTRA_CXXFLAGS="$SANITIZER_FLAGS -fno-omit-frame-pointer -stdlib=libstdc++ -isystem /usr/include/c++/13 -isystem /usr/include/x86_64-linux-gnu/c++/13 -isystem /usr/include/c++/13/backward" bash ./verify/windows_mock/run_windows_mock_tests.sh

      - name: Record sanitizer environment
        if: always()
        env:
          ASAN_OPTIONS: ${{ matrix.env_asan }}
          UBSAN_OPTIONS: ${{ matrix.env_ubsan }}
          TSAN_OPTIONS: ${{ matrix.env_tsan }}
        run: |
          {
            echo "### Sanitizer run"
            echo "- Mode: ${{ matrix.name }}"
            echo "- Compiler: $(clang++ --version | head -n 1)"
            echo "- Test log: verify/windows_mock/windows_mock_tests.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-${{ matrix.name }}
          path: verify/windows_mock/windows_mock_tests.log
          if-no-files-found: ignore
