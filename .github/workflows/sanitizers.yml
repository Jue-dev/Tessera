name: Sanitizers and Concurrency

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 3"

permissions:
  contents: read

jobs:
  sanitizer:
    name: Clang ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan-UBSan
            flags: -fsanitize=address,undefined
            env_asan: detect_leaks=1:halt_on_error=1
            env_ubsan: halt_on_error=1:print_stacktrace=1
          - name: TSan
            flags: -fsanitize=thread
            env_asan: ''
            env_ubsan: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes clang ninja-build

      - name: Configure instrumented build
        env:
          SANITIZER_FLAGS: ${{ matrix.flags }}
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DTESSERA_BUILD_TESTS=ON \
            -DTESSERA_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS"

      - name: Build
        run: cmake --build build-sanitizer --parallel 2

      - name: Run deterministic tests
        env:
          ASAN_OPTIONS: ${{ matrix.env_asan }}
          UBSAN_OPTIONS: ${{ matrix.env_ubsan }}
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-sanitizer --output-on-failure
