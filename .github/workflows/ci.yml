name: Tessera CI & SDK Release

on:
  # Full validation automatically runs for pull requests and relevant main pushes.
  # Release publication remains restricted to version-tag pushes.
  pull_request:
    branches: [ "main" ]
    paths:
      - ".clang-tidy"
      - "*.cmake"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "verify/**"
      - "examples/**"
      - "scripts/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  # Full validation on main and manually on any selected branch.
  # Tag pushes still run the release pipeline; path filters do not apply to tags.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - ".clang-tidy"
      - "*.cmake"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "verify/**"
      - "examples/**"
      - "scripts/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  # Select the develop branch in the Actions UI for manual development validation.
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Weekly full validation (Monday, 03:17 UTC).

concurrency:
  group: tessera-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64-debug
            arch: x64
            config: Debug
          - preset: x64-release
            arch: x64
            config: Release
          - preset: x86-debug
            arch: x86
            config: Debug
          - preset: x86-release
            arch: x86
            config: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure CMake (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run CTest (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Run safe example smoke (x64 Release)
        if: matrix.preset == 'x64-release'
        shell: pwsh
        run: |
          $examples = @(
            "artifacts/x64/Release/build/examples/tessera_example_01_scan_and_pe.exe",
            "artifacts/x64/Release/build/examples/tessera_example_03_rtti_and_reflection.exe",
            "artifacts/x64/Release/build/examples/tessera_example_04_blind_discovery.exe",
            "artifacts/x64/Release/build/examples/tessera_example_05_python_bridge.exe",
            "artifacts/x64/Release/build/examples/tessera_example_06_profiles_and_targets.exe"
          )
          foreach ($example in $examples) {
            if (-not (Test-Path $example)) { throw "Missing safe example executable: $example" }
            & $example
            if ($LASTEXITCODE -ne 0) { throw "Safe example smoke failed: $example" }
          }

      - name: Stage Installed SDK (${{ matrix.preset }})
        run: cmake --install artifacts/${{ matrix.arch }}/${{ matrix.config }}/build --prefix dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}

      - name: Upload SDK Artifact (Tessera-SDK-${{ matrix.preset }})
        uses: actions/upload-artifact@v7
        with:
          name: Tessera-SDK-${{ matrix.preset }}
          path: dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}
          if-no-files-found: error

  decoder-differential:
    name: Independent Decoder Differential (iced-x86)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned test-only decoder oracle
        run: python -m pip install --disable-pip-version-check iced-x86==1.21.0

      - name: Configure independent decoder differential test
        run: cmake -S . -B build-decoder-oracle -G Ninja -DCMAKE_BUILD_TYPE=Release -DTESSERA_BUILD_TESTS=ON -DTESSERA_BUILD_EXAMPLES=OFF -DTESSERA_ENABLE_DECODER_ORACLE=ON

      - name: Build decoder probe
        run: cmake --build build-decoder-oracle --target tessera_decoder_probe --parallel

      - name: Compare instruction boundaries against iced-x86
        run: ctest --test-dir build-decoder-oracle -R tessera_decoder_differential --output-on-failure

  windows-backend-mock:
    name: Windows Backend Mock (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run deterministic Windows backend mock tests
        run: bash ./verify/windows_mock/run_windows_mock_tests.sh
      - name: Run Windows backend mock tests with ASan and UBSan
        env:
          EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: bash ./verify/windows_mock/run_windows_mock_tests.sh

  detours-integration:
    name: Live Microsoft Detours Hook (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86

    steps:
      - name: Checkout Tessera
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout Microsoft Detours v4.0.1
        uses: actions/checkout@v5
        with:
          repository: microsoft/Detours
          ref: v4.0.1
          path: dependencies/Detours
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Build Microsoft Detours for ${{ matrix.arch }}
        shell: pwsh
        working-directory: dependencies/Detours/src
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\ci\detours.ps1" -Action Build -Architecture "${{ matrix.arch }}"'
      - name: Verify architecture-specific Detours outputs
        shell: pwsh
        run:  .\.github\scripts\ci\detours.ps1 -Action Verify -Architecture "${{ matrix.arch }}"
      - name: Build Tessera and run the live Detours test
        shell: pwsh
        run: |
          .\verify\windows\run_detours_integration.ps1 `
            -DetoursRoot "$env:GITHUB_WORKSPACE\dependencies\Detours" `
            -Architecture "${{ matrix.arch }}" `
            -Configuration Release

  no-rtti-and-packaging-gate:
    name: Quality Gate (/GR- No-RTTI, .bench & .fuzz Smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
 
      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure with Compiler RTTI Disabled (/GR-) and Benchmarks/Fuzz Enabled
        run:  .\.github\scripts\ci\configure.ps1 -Mode NoRtti
      - name: Build Release with /GR-
        run: cmake --build build-nortti --config Release --parallel

      - name: Run All Tests Under /GR-
        run: ctest --test-dir build-nortti -C Release --output-on-failure

      - name: Run Fuzz & Benchmark Smoke Targets (verify/fuzz & verify/bench)
        shell: pwsh
        run:  .\.github\scripts\ci\run-fuzz-bench-smoke.ps1 -BuildDirectory "build-nortti" -Configuration "Release"
      - name: Verify CMake Install Package (Single tessera.lib)
        run: cmake --install build-nortti --config Release --prefix install-nortti

  optional-cmake-presets:
    name: Optional CMake Presets (${{ matrix.preset }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-bench, x64-fuzz-smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure optional preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build optional preset
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Run optional preset CTest suite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  msvc-static-analysis:
    name: MSVC Static Analysis (/analyze, x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
 
      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure MSVC Code Analysis
        run: cmake --preset x64-analyze

      - name: Build with /analyze
        run: cmake --build --preset x64-analyze --parallel

      - name: Run CTest after /analyze build
        run: ctest --preset x64-analyze --output-on-failure

  reduced-configurations:
    name: Reduced CMake Configuration (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            options: "-DTESSERA_BUILD_PROFILE=OFF -DTESSERA_BUILD_TARGETS=OFF -DTESSERA_BUILD_LOGGING=OFF"
          - name: no-profile
            options: "-DTESSERA_BUILD_PROFILE=OFF"
          - name: no-targets
            options: "-DTESSERA_BUILD_TARGETS=OFF"
          - name: no-logging
            options: "-DTESSERA_BUILD_LOGGING=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Configure reduced SDK
        shell: pwsh
        run:  .\.github\scripts\ci\configure.ps1 -Mode Reduced -Options '${{ matrix.options }}'
      - name: Build reduced SDK
        run: cmake --build build-reduced --parallel

      - name: Install reduced SDK
        run: cmake --install build-reduced --prefix install-reduced

      - name: Configure and build installed-package consumer
        shell: pwsh
        run:  .\.github\scripts\ci\test-installed-sdk-consumer.ps1 -Options '${{ matrix.options }}'

  release-package-dry-run:
    # Exercise the exact release assembly and checksum path on PRs/manual runs,
    # without creating a tag or publishing a GitHub Release.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Release SDK Package (tag-independent dry run)
    needs: [build-and-test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all architecture/configuration SDK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Tessera-SDK-*
          path: sdk-Input
          merge-multiple: false

      - name: Assemble unified SDK package
        shell: pwsh
        run: .\.github\scripts\ci\package-sdk-bundle.ps1

      - name: Generate SDK SHA256SUMS
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\Tessera-SDK-Windows.zip).Hash.ToLowerInvariant()
          "$hash  Tessera-SDK-Windows.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Validate release archive contents and checksum
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path .\Tessera-SDK-Windows.zip).Path
          $checksumLine = (Get-Content .\SHA256SUMS.txt -Raw).Trim()
          if ($checksumLine -notmatch '^(?<hash>[0-9a-fA-F]{64})  Tessera-SDK-Windows[.]zip$') {
            throw "SHA256SUMS.txt has an invalid format."
          }
          $declaredHash = $Matches.hash.ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          if ($declaredHash -ne $actualHash) {
            throw "SDK archive checksum does not match SHA256SUMS.txt."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $requiredEntries = @(
              "include/tessera/tessera.hpp",
              "x64/Release/lib/tessera.lib",
              "x64/Debug/lib/tessera.lib",
              "x86/Release/lib/tessera.lib",
              "x86/Debug/lib/tessera.lib",
              "x64/Release/lib/cmake/Tessera/TesseraConfig.cmake",
              "x64/Debug/lib/cmake/Tessera/TesseraConfig.cmake",
              "x86/Release/lib/cmake/Tessera/TesseraConfig.cmake",
              "x86/Debug/lib/cmake/Tessera/TesseraConfig.cmake"
            )
            $missing = @($requiredEntries | Where-Object { $_ -notin $entries })
            if ($missing.Count -gt 0) {
              throw "SDK archive is missing required entries: $($missing -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Validated SDK archive and SHA256SUMS.txt."

      - name: Upload validated dry-run package
        uses: actions/upload-artifact@v7
        with:
          name: Tessera-SDK-release-dry-run
          path: |
            Tessera-SDK-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish-sdk-bundle:
    # Manual validation must not assemble or publish release artifacts.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Bundle Full SDK & Publish GitHub Release
    needs: [build-and-test, no-rtti-and-packaging-gate, detours-integration, msvc-static-analysis]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download All Built SDK Artifacts
        uses: actions/download-artifact@v8
        with:
          path: sdk-Input

      - name: Assemble Unified Tessera-SDK-Windows Package
        shell: pwsh
        run:  .\.github\scripts\ci\package-sdk-bundle.ps1
      - name: Generate SDK SHA256SUMS
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\Tessera-SDK-Windows.zip).Hash.ToLowerInvariant()
          "$hash  Tessera-SDK-Windows.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Upload Combined SDK Bundle Artifact (Tessera-SDK-Full)
        uses: actions/upload-artifact@v7
        with:
          name: Tessera-SDK-Full
          path: |
            Tessera-SDK-Windows.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release (On Tag Push v*)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tessera-SDK-Windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
