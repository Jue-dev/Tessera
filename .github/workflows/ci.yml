name: Tessera CI
on:
 pull_request:
  branches: ["main"]
  paths: [".clang-tidy","*.cmake","CMakeLists.txt","CMakePresets.json","cmake/**","include/**","src/**","verify/**","examples/**","scripts/**",
      "tools/**","vcpkg.json","vcpkg-configuration.json",".github/workflows/**",".github/actions/**",".github/scripts/**"]
 push:
  branches: ["main"]
  paths: [".clang-tidy","*.cmake","CMakeLists.txt","CMakePresets.json","cmake/**","include/**","src/**","verify/**","examples/**","scripts/**","vcpkg.json","vcpkg-configuration.json",".github/workflows/**",".github/actions/**",".github/scripts/**"]
 workflow_dispatch:
concurrency:
 group: tessera-ci-${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
 contents: read
jobs:
 windows-build:
  runs-on: windows-latest
  strategy:
   fail-fast: false
   matrix:
    include:
     - {preset: x64-debug, arch: x64, config: Debug}
     - {preset: x64-release, arch: x64, config: Release}
     - {preset: x86-debug, arch: x86, config: Debug}
     - {preset: x86-release, arch: x86, config: Release}
  steps:
   - uses: actions/checkout@v5
     with: {persist-credentials: false}
   - uses: ./.github/actions/setup-msvc
     with: {arch: ${{ matrix.arch }}}
   - name: Generate PE fixtures
     shell: pwsh
     run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures
   - run: cmake --preset ${{ matrix.preset }}
   - run: cmake --build --preset ${{ matrix.preset }}
   - run: ctest --preset ${{ matrix.preset }} --output-on-failure
   - name: Safe examples smoke
     if: matrix.preset == 'x64-release'
     shell: pwsh
     run: .\.github\scripts\ci-verify.ps1 -Task examples
   - run: cmake --install artifacts/${{ matrix.arch }}/${{ matrix.config }}/build --prefix dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}
   - uses: actions/upload-artifact@v7
     with:
      name: Tessera-SDK-${{ matrix.preset }}
      path: dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}
      if-no-files-found: error
 linux-portable:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v5
   - run: cmake -S . -B build-portable -G Ninja -DCMAKE_BUILD_TYPE=Release -DTESSERA_BUILD_TESTS=OFF -DTESSERA_BUILD_EXAMPLES=OFF
   - run: cmake --build build-portable --target tessera_core tessera_diagnostics tessera_reflection tessera_disasm tessera_pattern tessera_utility tessera_filesystem tessera_json tessera_profiling --parallel 2
 decoder-oracle:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v5
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - uses: actions/setup-python@v6
     with: {python-version: "3.12"}
   - run: python -m pip install --disable-pip-version-check iced-x86==1.21.0
   - shell: pwsh
     run: .\.github\scripts\ci-verify.ps1 -Task decoder-oracle
 windows-mock:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v5
   - run: bash ./.github/scripts/ci-windows-mock.sh
 detours-integration:
  runs-on: windows-latest
  strategy: {fail-fast: false, matrix: {arch: [x64, x86]}}
  steps:
   - uses: actions/checkout@v5
   - uses: actions/checkout@v5
     with: {repository: microsoft/Detours, ref: v4.0.1, path: dependencies/Detours, persist-credentials: false}
   - uses: ./.github/actions/setup-msvc
     with: {arch: ${{ matrix.arch }}}
   - shell: pwsh
     working-directory: dependencies/Detours/src
     run: '& "$env:GITHUB_WORKSPACE\.github\scripts\ci-build.ps1" -Task detours -Action Build -Architecture "${{ matrix.arch }}"'
   - shell: pwsh
     run: .\.github\scripts\ci-build.ps1 -Task detours -Action Verify -Architecture "${{ matrix.arch }}"
   - shell: pwsh
     run: .\.github\scripts\ci-build.ps1 -Task detours-integration -DetoursRoot "$env:GITHUB_WORKSPACE\dependencies\Detours" -Architecture "${{ matrix.arch }}" -Configuration Release
 no-rtti-gate:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v5
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - shell: pwsh
     run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures
   - shell: pwsh
     run: .\.github\scripts\ci-build.ps1 -Task configure -Mode NoRtti
   - run: cmake --build build-nortti --config Release --parallel
   - run: ctest --test-dir build-nortti -C Release --output-on-failure
   - shell: pwsh
     run: .\.github\scripts\ci-verify.ps1 -Task fuzz-bench -BuildDirectory build-nortti -Configuration Release
   - run: cmake --install build-nortti --config Release --prefix install-nortti
   - shell: pwsh
     run: .\.github\scripts\ci-sdk.ps1 -Task consumer -SdkPrefix "$env:GITHUB_WORKSPACE\install-nortti"
 optional-presets:
  runs-on: windows-latest
  timeout-minutes: 60
  strategy: {fail-fast: false, matrix: {preset: [x64-bench, x64-fuzz-smoke]}}
  steps:
   - uses: actions/checkout@v5
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - shell: pwsh
     run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures
   - shell: pwsh
     run: .\.github\scripts\ci-build.ps1 -Task preset -Preset "${{ matrix.preset }}"
 msvc-analysis:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v5
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - run: cmake --preset x64-analyze
   - run: cmake --build --preset x64-analyze --parallel
   - run: ctest --preset x64-analyze --output-on-failure
 reduced-consumers:
  runs-on: windows-latest
  strategy:
   fail-fast: false
   matrix:
    include:
     - {name: minimal, options: "-DTESSERA_BUILD_PROFILE=OFF -DTESSERA_BUILD_TARGETS=OFF -DTESSERA_BUILD_LOGGING=OFF"}
     - {name: no-profile, options: "-DTESSERA_BUILD_PROFILE=OFF"}
     - {name: no-targets, options: "-DTESSERA_BUILD_TARGETS=OFF"}
     - {name: no-logging, options: "-DTESSERA_BUILD_LOGGING=OFF"}
  steps:
   - uses: actions/checkout@v5
   - uses: ./.github/actions/setup-msvc
     with: {arch: x64}
   - shell: pwsh
     run: .\.github\scripts\ci-build.ps1 -Task configure -Mode Reduced -Options '${{ matrix.options }}'
   - run: cmake --build build-reduced --parallel
   - run: cmake --install build-reduced --prefix install-reduced
   - shell: pwsh
     run: .\.github\scripts\ci-sdk.ps1 -Task consumer -Options '${{ matrix.options }}' -SdkPrefix "$env:GITHUB_WORKSPACE\install-reduced"

  cli-smoke:
    name: Optional offline CLI and JSON smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Generate PE fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures
      - name: Configure optional CLI
        shell: pwsh
        run: cmake -S . -B build-cli -G Ninja -DCMAKE_BUILD_TYPE=Release -DTESSERA_BUILD_TESTS=ON -DTESSERA_BUILD_EXAMPLES=OFF -DTESSERA_BUILD_CLI=ON
      - name: Build optional CLI and tests
        run: cmake --build build-cli --parallel 2
      - name: Run CLI command and JSON smoke suite
        shell: pwsh
        run: ctest --test-dir build-cli -R tessera_cli_smoke --output-on-failure
