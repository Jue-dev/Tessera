name: Tessera CI & SDK Release

on:
  # Full validation runs on main only when build/source inputs change, or when
  # explicitly dispatched. Weekly scheduled runs are disabled to conserve Actions.
  # Tag pushes still run the release pipeline; path filters do not apply to tags.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - ".clang-tidy"
      - "*.cmake"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "verify/**"
      - "examples/**"
      - "scripts/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  # Select the develop branch in the Actions UI for manual development validation.
  workflow_dispatch:

concurrency:
  group: tessera-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64-debug
            arch: x64
            config: Debug
          - preset: x64-release
            arch: x64
            config: Release
          - preset: x86-debug
            arch: x86
            config: Debug
          - preset: x86-release
            arch: x86
            config: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure CMake (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run CTest (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Stage Installed SDK (${{ matrix.preset }})
        run: cmake --install artifacts/${{ matrix.arch }}/${{ matrix.config }}/build --prefix dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}

      - name: Upload SDK Artifact (Tessera-SDK-${{ matrix.preset }})
        uses: actions/upload-artifact@v7
        with:
          name: Tessera-SDK-${{ matrix.preset }}
          path: dist/TesseraSDK/${{ matrix.arch }}/${{ matrix.config }}
          if-no-files-found: error

  detours-integration:
    name: Live Microsoft Detours Hook (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86

    steps:
      - name: Checkout Tessera
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout Microsoft Detours v4.0.1
        uses: actions/checkout@v5
        with:
          repository: microsoft/Detours
          ref: v4.0.1
          path: dependencies/Detours
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (${{ matrix.arch }})
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Build Microsoft Detours for ${{ matrix.arch }}
        shell: pwsh
        working-directory: dependencies/Detours/src
        run: |
          $targetProcessor = if ('${{ matrix.arch }}' -eq 'x86') { 'X86' } else { 'X64' }
          nmake /nologo "DETOURS_TARGET_PROCESSOR=$targetProcessor"
          if ($LASTEXITCODE -ne 0) { throw "Detours NMake failed ($LASTEXITCODE)." }

      - name: Verify architecture-specific Detours outputs
        shell: pwsh
        run: |
          $detoursArch = if ('${{ matrix.arch }}' -eq 'x86') { 'X86' } else { 'X64' }
          $library = Join-Path $env:GITHUB_WORKSPACE "dependencies/Detours/lib.$detoursArch/detours.lib"
          $header = Join-Path $env:GITHUB_WORKSPACE "dependencies/Detours/include/detours.h"
          if (-not (Test-Path $library)) { throw "Missing architecture-specific library: $library" }
          if (-not (Test-Path $header)) { throw "Missing Detours header: $header" }
          Write-Host "Detours header: $header"
          Write-Host "Detours library: $library"

      - name: Build Tessera and run the live Detours test
        shell: pwsh
        run: |
          .\verify\windows\run_detours_integration.ps1 `
            -DetoursRoot "$env:GITHUB_WORKSPACE\dependencies\Detours" `
            -Architecture "${{ matrix.arch }}" `
            -Configuration Release

  no-rtti-and-packaging-gate:
    name: Quality Gate (/GR- No-RTTI, .bench & .fuzz Smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
 
      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure with Compiler RTTI Disabled (/GR-) and Benchmarks/Fuzz Enabled
        run: |
          cmake -S . -B build-nortti -G "Visual Studio 18 2026" -A x64 -DTESSERA_BUILD_TESTS=ON -DTESSERA_BUILD_BENCH=ON -DTESSERA_BUILD_FUZZ=ON -DCMAKE_CXX_FLAGS="/GR-"

      - name: Build Release with /GR-
        run: cmake --build build-nortti --config Release --parallel

      - name: Run All Tests Under /GR-
        run: ctest --test-dir build-nortti -C Release --output-on-failure

      - name: Run Fuzz & Benchmark Smoke Targets (verify/fuzz & verify/bench)
        shell: pwsh
        run: |
          $targets = @(
            "build-nortti/verify/fuzz/Release/tessera_fuzz_pattern.exe",
            "build-nortti/verify/fuzz/Release/tessera_fuzz_pe.exe",
            "build-nortti/verify/fuzz/Release/tessera_fuzz_json.exe",
            "build-nortti/verify/fuzz/Release/tessera_fuzz_native_hook.exe",
            "build-nortti/verify/bench/Release/tessera_bench.exe"
          )
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Missing Release smoke target: $target" }
            Write-Host "Running $target"
            & $target
            if ($LASTEXITCODE -ne 0) { throw "Smoke target failed ($LASTEXITCODE): $target" }
          }

      - name: Verify CMake Install Package (Single tessera.lib)
        run: cmake --install build-nortti --config Release --prefix install-nortti

  msvc-static-analysis:
    name: MSVC Static Analysis (/analyze, x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
 
      - name: Generate PE test fixtures
        shell: pwsh
        run: .\verify\windows\generate_test_fixtures.ps1 -OutputDirectory .\verify\tests\fixtures

      - name: Configure MSVC Code Analysis
        run: cmake --preset x64-analyze

      - name: Build with /analyze
        run: cmake --build --preset x64-analyze --parallel

      - name: Run CTest after /analyze build
        run: ctest --preset x64-analyze --output-on-failure

  publish-sdk-bundle:
    name: Bundle Full SDK & Publish GitHub Release
    needs: [build-and-test, no-rtti-and-packaging-gate, detours-integration, msvc-static-analysis]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download All Built SDK Artifacts
        uses: actions/download-artifact@v8
        with:
          path: sdk-Input

      - name: Assemble Unified Tessera-SDK-Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "TesseraSDK" -Force | Out-Null
          Copy-Item -Path "include" -Destination "TesseraSDK\include" -Recurse -Force
          foreach ($preset in @("x64-release", "x64-debug", "x86-release", "x86-debug")) {
            $parts = $preset.Split("-")
            $arch = $parts[0]
            $cfg  = if ($parts[1] -eq "debug") { "Debug" } else { "Release" }
            $srcDir = "sdk-Input\Tessera-SDK-$preset"
            $dstDir = "TesseraSDK\$arch\$cfg"
            New-Item -ItemType Directory -Path $dstDir -Force | Out-Null
            Copy-Item -Path "$srcDir\*" -Destination $dstDir -Recurse -Force
          }
          Compress-Archive -Path "TesseraSDK\*" -DestinationPath "Tessera-SDK-Windows.zip" -Force

      - name: Upload Combined SDK Bundle Artifact (Tessera-SDK-Full)
        uses: actions/upload-artifact@v7
        with:
          name: Tessera-SDK-Full
          path: Tessera-SDK-Windows.zip

      - name: Publish GitHub Release (On Tag Push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tessera-SDK-Windows.zip
          generate_release_notes: true
